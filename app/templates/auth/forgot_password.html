{% extends "shared/base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="mc-auth-card">
  <div class="mc-auth-logo">
    <i class="bi bi-hospital-fill"></i>
    <h1 style="color:#5b21b6">Rivive SCH</h1>
    <p>Reset your password</p>
  </div>

  <form method="POST" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="mc-form-label mc-required">Registered Email</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" class="form-control"
               placeholder="Enter your email address" required autofocus>
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2">
      <i class="bi bi-send me-2"></i>Send Reset Link
    </button>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}" class="small">
        <i class="bi bi-arrow-left me-1"></i>Back to Login
      </a>
    </div>
  </form>
</div>
{% endblock %}
