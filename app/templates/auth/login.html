{% extends "shared/base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="mc-auth-card">
  <div class="mc-auth-logo">
    <i class="bi bi-hospital-fill"></i>
    <h1 style="color:#5b21b6">Rivive SCH</h1>
    <p>Speciality Care Hospital — ECR, OMR, Thiruporur</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="mc-form-label mc-required">Username or Email</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="username" class="form-control"
               placeholder="Enter username or email" required autofocus
               value="{{ request.form.get('username', '') }}">
      </div>
    </div>

    <div class="mb-3">
      <label class="mc-form-label mc-required">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" id="password" class="form-control"
               placeholder="Enter password" required>
        <button type="button" class="btn btn-outline-secondary"
                onclick="togglePwd()" tabindex="-1">
          <i class="bi bi-eye" id="pwd-eye"></i>
        </button>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="remember" id="remember">
        <label class="form-check-label small" for="remember">Remember me</label>
      </div>
      <a href="{{ url_for('auth.forgot_password') }}" class="small">Forgot password?</a>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </form>

  <p class="text-center mt-4 mb-0 small text-muted">
    Rivive SCH &copy; {{ now().year if now is callable else 2025 }} — Secure Medical ERP
  </p>
</div>

<script>
function togglePwd() {
  const p = document.getElementById('password');
  const e = document.getElementById('pwd-eye');
  if (p.type === 'password') { p.type = 'text'; e.className = 'bi bi-eye-slash'; }
  else { p.type = 'password'; e.className = 'bi bi-eye'; }
}
</script>
{% endblock %}
