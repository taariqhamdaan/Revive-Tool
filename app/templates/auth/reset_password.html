{% extends "shared/base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="mc-auth-card">
  <div class="mc-auth-logo">
    <i class="bi bi-hospital-fill"></i>
    <h1 style="color:#5b21b6">Rivive SCH</h1>
    <p>Set your new password</p>
  </div>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="mc-form-label mc-required">New Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required minlength="8">
      </div>
    </div>
    <div class="mb-3">
      <label class="mc-form-label mc-required">Confirm Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required minlength="8">
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2">
      <i class="bi bi-check-circle me-2"></i>Reset Password
    </button>
  </form>
</div>
{% endblock %}
