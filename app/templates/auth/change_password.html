{% extends "shared/base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="mc-page-header">
  <h1 class="mc-page-title"><i class="bi bi-key me-2"></i>Change Password</h1>
</div>
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="mc-card">
      <div class="mc-card-header"><i class="bi bi-shield-lock"></i> Update Password</div>
      <div class="mc-card-body">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="mc-form-label mc-required">Current Password</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="mc-form-label mc-required">New Password</label>
            <input type="password" name="new_password" class="form-control" required minlength="8">
          </div>
          <div class="mb-3">
            <label class="mc-form-label mc-required">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" required minlength="8">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>Update Password
            </button>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
